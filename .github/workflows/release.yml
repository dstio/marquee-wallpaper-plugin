# A tag v<version> builds the signed APK and puts it, with its SHA-256, on a draft GitHub Release.
# The job runs in the `release` environment, which holds the signing key and the TMDB key and waits
# for a maintainer's approval. The draft is published by hand after a look.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version code counts commits
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true # nothing from another run goes into a signed build

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test and build the signed APK
        env:
          MARQUEE_KEYSTORE_B64: ${{ secrets.MARQUEE_KEYSTORE_B64 }}
          MARQUEE_STORE_PASSWORD: ${{ secrets.MARQUEE_STORE_PASSWORD }}
          MARQUEE_KEY_ALIAS: ${{ secrets.MARQUEE_KEY_ALIAS }}
          MARQUEE_KEY_PASSWORD: ${{ secrets.MARQUEE_KEY_PASSWORD }}
          MARQUEE_TMDB_TOKEN: ${{ secrets.MARQUEE_TMDB_TOKEN }}
        run: |
          set -euo pipefail
          for name in MARQUEE_KEYSTORE_B64 MARQUEE_STORE_PASSWORD MARQUEE_KEY_ALIAS MARQUEE_KEY_PASSWORD MARQUEE_TMDB_TOKEN; do
            if [ -z "${!name}" ]; then echo "The secret $name is not set" >&2; exit 1; fi
          done
          umask 077
          export MARQUEE_KEYSTORE_FILE="$RUNNER_TEMP/marquee.jks"
          trap 'rm -f "$MARQUEE_KEYSTORE_FILE"' EXIT
          printf '%s' "$MARQUEE_KEYSTORE_B64" | base64 -d > "$MARQUEE_KEYSTORE_FILE"
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify the signature
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/marquee-"$VERSION"-*-release.apk)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "marquee-$VERSION.apk"
          sha256sum "marquee-$VERSION.apk" > "marquee-$VERSION.apk.sha256"
          cat "marquee-$VERSION.apk.sha256"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sum=$(cut -d' ' -f1 "marquee-$VERSION.apk.sha256")
          gh release create "$GITHUB_REF_NAME" "marquee-$VERSION.apk" "marquee-$VERSION.apk.sha256" \
            --draft --title "Marquee $VERSION" \
            --notes "Needs ATV Launcher. Install the APK, then in ATV Launcher open Settings > Wallpaper and choose Marquee under Plugins.

          SHA-256 of marquee-$VERSION.apk: \`$sum\`"
