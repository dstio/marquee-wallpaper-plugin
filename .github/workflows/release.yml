# A tag v<version> builds the signed APK and publishes it, with its SHA-256, as a GitHub Release,
# then copies it to the rolling `latest` release under a fixed file name, so one address always
# serves the newest build:
#
#   https://github.com/dstio/marquee-wallpaper-plugin/releases/download/latest/marquee-atvl-plugin.apk
#
# The job runs in the `release` environment, which holds the signing key and the TMDB key and waits
# for a maintainer's approval: that approval is the look before the release goes out. latest.yml
# rebuilds the rolling release by hand from a release that is already out.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version code counts commits
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true # nothing from another run goes into a signed build

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test and build the signed APK
        env:
          MARQUEE_KEYSTORE_B64: ${{ secrets.MARQUEE_KEYSTORE_B64 }}
          MARQUEE_STORE_PASSWORD: ${{ secrets.MARQUEE_STORE_PASSWORD }}
          MARQUEE_KEY_ALIAS: ${{ secrets.MARQUEE_KEY_ALIAS }}
          MARQUEE_KEY_PASSWORD: ${{ secrets.MARQUEE_KEY_PASSWORD }}
          MARQUEE_TMDB_TOKEN: ${{ secrets.MARQUEE_TMDB_TOKEN }}
        run: |
          set -euo pipefail
          for name in MARQUEE_KEYSTORE_B64 MARQUEE_STORE_PASSWORD MARQUEE_KEY_ALIAS MARQUEE_KEY_PASSWORD MARQUEE_TMDB_TOKEN; do
            if [ -z "${!name}" ]; then echo "The secret $name is not set" >&2; exit 1; fi
          done
          umask 077
          export MARQUEE_KEYSTORE_FILE="$RUNNER_TEMP/marquee.jks"
          trap 'rm -f "$MARQUEE_KEYSTORE_FILE"' EXIT
          printf '%s' "$MARQUEE_KEYSTORE_B64" | base64 -d > "$MARQUEE_KEYSTORE_FILE"
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify the signature
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/marquee-"$VERSION"-*-release.apk)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "marquee-atvl-plugin-$VERSION.apk"
          sha256sum "marquee-atvl-plugin-$VERSION.apk" > "marquee-atvl-plugin-$VERSION.apk.sha256"
          cat "marquee-atvl-plugin-$VERSION.apk.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sum=$(cut -d' ' -f1 "marquee-atvl-plugin-$VERSION.apk.sha256")
          gh release create "$GITHUB_REF_NAME" "marquee-atvl-plugin-$VERSION.apk" "marquee-atvl-plugin-$VERSION.apk.sha256" \
            --verify-tag --latest --title "Marquee $VERSION" \
            --notes "Needs ATV Launcher. Install the APK, then in ATV Launcher open Settings > Wallpaper and choose Marquee under Plugins.

          Always the newest build, under one file name: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/marquee-atvl-plugin.apk

          SHA-256 of marquee-atvl-plugin-$VERSION.apk: \`$sum\`"

      - name: Update the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir out
          cp "marquee-atvl-plugin-$VERSION.apk" out/marquee-atvl-plugin.apk
          (cd out && sha256sum marquee-atvl-plugin.apk > marquee-atvl-plugin.apk.sha256)
          sum=$(cut -d' ' -f1 out/marquee-atvl-plugin.apk.sha256)
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest out/marquee-atvl-plugin.apk out/marquee-atvl-plugin.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Marquee, newest build" \
            --notes "Always the newest release, under one file name. Today that is [Marquee $VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME).

          Fixed address: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/marquee-atvl-plugin.apk

          SHA-256 of marquee-atvl-plugin.apk: \`$sum\`"
